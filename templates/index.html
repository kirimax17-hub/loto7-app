<html lang="ja">

  <meta name="theme-color" content="#111827">

      --card:#ffffff;
      --ink:#111827;
      --muted:#6b7280;

      --blue:#1d5fa7;
      --blue2:#eaf3ff;

    *{

    }

    body{

      font-family:

        "Helvetica Neue",

        sans-serif;

      background:var(--bg);
      color:var(--ink);
    }

    .wrap{

      margin:auto;

    .sub{

      font-weight:700;

    }

<body>

<div class="wrap">

  <h1>ロト7 30通りジェネレーター</h1>

        <input

  <div class="card">

        対象回
      </label>

      <input
        id="prizeDraw"
        type="number"
      >


      <div
        class="row"
        style="margin-top:10px"
      >

        <div>
          <label>1等</label>
          <input id="p1" type="number" value="0">
        </div>

        <div>
          <label>2等</label>
          <input id="p2" type="number" value="0">
        </div>

      </div>


      <div
        class="row"
        style="margin-top:10px"
      >

        <div>
          <label>3等</label>
          <input id="p3" type="number" value="0">
        </div>

        <div>
          <label>4等</label>
          <input id="p4" type="number" value="0">

      </div>


      <div
        class="row"
        style="margin-top:10px"

        <div>
          <label>5等</label>

      結果を更新すると表示されます。
    </div>

  </div>


  <!-- 注意 -->
  <div class="card tiny">

    ℹ️ 過去に出た本数字7個の完全一致組み合わせは
    生成対象から除外しています。

    <br><br>

    ただし、この除外や過去の出現傾向を利用すること自体が、
    将来の抽せんにおける数学的な当選確率を高めるものではありません。

  </div>

<script>

/* =========================
   localStorage
========================= */

const LS = {

  history:
    "l7_history_v1",

  purchases:
    "l7_purchases_v1",

  lastTickets:
    "l7_last_tickets_v1",

  settings:
    "l7_settings_v1"

};


const get = (k,d) => {

  try{

    return JSON.parse(
      localStorage.getItem(k)
    ) ?? d;

  }catch{

    return d;

  }

};


const set = (k,v) => {

  localStorage.setItem(
    k,
    JSON.stringify(v)
  );

};


const yen = n =>

  "¥" +
  Number(n || 0)
    .toLocaleString("ja-JP");



/* =========================
   等級
========================= */

function rankOf(
  mainMatches,
  bonusMatches
){

  if(mainMatches === 7)
    return "1等";

  if(
    mainMatches === 6 &&
    bonusMatches >= 1
  )
    return "2等";

  if(mainMatches === 6)
    return "3等";

  if(mainMatches === 5)
    return "4等";

  if(mainMatches === 4)
    return "5等";

  if(
    mainMatches === 3 &&
    bonusMatches >= 1
  )
    return "6等";

  return "";

}



function overlap(a,b){

  return a.filter(
    x => b.includes(x)
  ).length;

}



/* =========================
   重み付き抽出
========================= */

function weightedPickWithoutReplacement(
  weights,
  k
){

  const items =
    Array.from(
      {length:37},
      (_,i) => i + 1
    );


  const chosen = [];


  for(
    let c=0;
    c<k;
    c++
  ){

    let total =
      items.reduce(
        (s,n) =>
          s + (weights[n] || 0),
        0
      );


    let x =
      Math.random() * total;


    let acc = 0;

    let idx =
      items.length - 1;


    for(
      let i=0;
      i<items.length;
      i++
    ){

      acc +=
        weights[items[i]] || 0;


      if(x <= acc){

        idx = i;

        break;

      }

    }


    chosen.push(
      items.splice(idx,1)[0]
    );

  }


  return chosen.sort(
    (a,b) => a-b
  );

}



/* =========================
   重み計算
========================= */

function computeWeights(history){

  let allW =
    +document
      .getElementById("allW")
      .value;


  let recentW =
    +document
      .getElementById("recentW")
      .value;


  let uniformW =
    +document
      .getElementById("uniformW")
      .value;


  let sumW =
    allW +
    recentW +
    uniformW;


  if(sumW <= 0)
    sumW = 1;


  allW /= sumW;

  recentW /= sumW;

  uniformW /= sumW;


  const all =
    Array(38).fill(0);


  const recent =
    Array(38).fill(0);


  history.forEach(
    r =>
      r.main.forEach(
        n => all[n]++
      )
  );


  history
    .slice(-100)
    .forEach(
      r =>
        r.main.forEach(
          n => recent[n]++
        )
    );


  const ta =
    all.reduce(
      (a,b)=>a+b,
      0
    ) || 1;


  const tr =
    recent.reduce(
      (a,b)=>a+b,
      0
    ) || 1;


  const w = {};


  for(
    let n=1;
    n<=37;
    n++
  ){

    w[n] =

      allW *
      (all[n] / ta)

      +

      recentW *
      (recent[n] / tr)

      +

      uniformW *
      (1 / 37);

  }


  return w;

}



/* =========================
   30通り生成
========================= */

function generateTickets(){

  const history =
    get(LS.history, []);


  if(!history.length){

    alert(
      "先に「① 結果を更新」を押してください。"
    );

    return;

  }


  const latest =
    history[
      history.length - 1
    ].draw;


  const target =
    latest + 1;


  const saved =
    get(
      LS.lastTickets,
      null
    );


  /*
    同じ対象回を
    何度も生成しない
  */

  if(
    saved &&
    saved.targetDraw === target &&
    Array.isArray(saved.tickets) &&
    saved.tickets.length === 30
  ){

    renderAll();

    document
      .getElementById("status")
      .textContent =

      `第${target}回用30通りはすでに生成済みです。第${latest}回までの結果を使用しています。`;


    return;

  }


  const weights =
    computeWeights(history);


  /*
    過去1等の
    完全一致組み合わせ
  */

  const past =
    new Set(

      history.map(
        r =>
          r.main
            .slice()
            .sort((a,b)=>a-b)
            .join("-")
      )

    );


  const maxOverlap =
    Math.max(
      0,
      Math.min(
        6,
        +document
          .getElementById("maxOverlap")
          .value || 5
      )
    );


  let pool = [];

  const seen =
    new Set();


  for(
    let attempts=0;

    attempts < 120000 &&
    pool.length < 5000;

    attempts++
  ){

    const nums =
      weightedPickWithoutReplacement(
        weights,
        7
      );


    const key =
      nums.join("-");


    if(
      past.has(key) ||
      seen.has(key)
    )
      continue;


    const odd =
      nums.filter(
        n => n % 2
      ).length;


    const low =
      nums.filter(
        n => n <= 18
      ).length;


    /*
      極端な構成だけ除外
    */

    if(
      odd === 0 ||
      odd === 7 ||
      low === 0 ||
      low === 7
    )
      continue;


    seen.add(key);


    const score =

      nums.reduce(

        (s,n) =>

          s +
          Math.log(
            (weights[n] || 1e-12)
            + 1e-15
          ),

        0

      )

      +

      Math.random() * .12;


    pool.push({
      nums,
      score
    });

  }


  pool.sort(
    (a,b) =>
      b.score - a.score
  );


  const selected = [];


  for(const p of pool){

    if(

      selected.every(

        s =>
          overlap(
            p.nums,
            s.nums
          )
          <= maxOverlap

      )

    ){

      selected.push(p);


      if(
        selected.length === 30
      )
        break;

    }

  }


  /*
    足りない場合
  */

  if(
    selected.length < 30
  ){

    for(const p of pool){

      if(

        !selected.some(

          s =>
            s.nums.join("-")
            ===
            p.nums.join("-")

        )

      ){

        selected.push(p);


        if(
          selected.length === 30
        )
          break;

      }

    }

  }


  if(
    selected.length < 30
  ){

    alert(
      "条件が厳しすぎて30通り生成できませんでした。"
    );

    return;

  }


  /*
    ★重要

    ここでは
    purchases に入れない。

    予測しただけなので
    購入額は増えない。
  */

  set(
    LS.lastTickets,
    {

      sourceDraw:
        latest,

      targetDraw:
        target,

      tickets:
        selected.map(
          x => x.nums
        )

    }
  );


  renderAll();


  document
    .getElementById("status")
    .textContent =

    `第1回〜第${latest}回の${history.length}回分を分析し、第${target}回用30通りを生成しました。`;

}



/* =========================
   購入確定
========================= */

function confirmPurchase(){

  const x =
    get(
      LS.lastTickets,
      null
    );


  if(
    !x ||
    !Array.isArray(x.tickets) ||
    x.tickets.length !== 30
  ){

    alert(
      "先に30通りを生成してください。"
    );

    return;

  }


  let purchases =
    get(
      LS.purchases,
      []
    );


  /*
    同じ対象回が
    すでに購入済みか
  */

  const alreadyPurchased =

    purchases.some(

      p =>
        p.targetDraw
        ===
        x.targetDraw

    );


  if(alreadyPurchased){

    alert(
      `第${x.targetDraw}回はすでに購入済みです。`
    );

    renderAll();

    return;

  }


  const newTickets =

    x.tickets.map(

      (nums,i) => ({

        sourceDraw:
          x.sourceDraw,

        targetDraw:
          x.targetDraw,

        ticketNo:
          i + 1,

        nums:
          nums,

        price:
          300,

        checked:
          false,

        matches:
          null,

        bonusMatches:
          null,

        rank:
          "",

        prize:
          0

      })

    );


  purchases.push(
    ...newTickets
  );


  set(
    LS.purchases,
    purchases
  );


  renderAll();


  alert(
    `第${x.targetDraw}回の30通りを購入済みに登録しました。\n購入額 ¥9,000 を収支に反映しました。`
  );

}



/* =========================
   結果更新
========================= */

async function updateHistory(){

  document
    .getElementById("status")
    .textContent =

    "過去結果を取得しています…";


  try{

    const r =
      await fetch(
        "/api/history",
        {
          cache:"no-store"
        }
      );


    const j =
      await r.json();


    if(!j.ok){

      throw new Error(
        j.error ||
        "取得失敗"
      );

    }


    if(
      !Array.isArray(j.history) ||
      !j.history.length
    ){

      throw new Error(
        "結果データが空です"
      );

    }


    set(
      LS.history,
      j.history
    );


    const latest =
      j.history[
        j.history.length - 1
      ].draw;


    document
      .getElementById("status")
      .textContent =

      `第${latest}回まで更新しました。`;


    /*
      自動で照合はしない。

      ユーザーが③を押した時に
      照合する。
    */

    renderAll();

  }

  catch(e){

    console.error(e);


    document
      .getElementById("status")
      .textContent =

      "更新に失敗しました。通信状況または取得ページ側の変更をご確認ください。";

  }

}



/* =========================
   当選照合
========================= */

function checkResults(){

  const history =
    get(
      LS.history,
      []
    );


  const last =
    get(
      LS.lastTickets,
      null
    );


  if(
    !last ||
    !last.targetDraw
  ){

    alert(
      "予測データがありません。"
    );

    return;

  }


  const result =
    history.find(

      r =>
        r.draw
        ===
        last.targetDraw

    );


  if(!result){

    alert(
      `第${last.targetDraw}回の結果はまだ取得されていません。`
    );

    return;

  }


  let purchases =
    get(
      LS.purchases,
      []
    );


  const targetPurchases =
    purchases.filter(

      p =>
        p.targetDraw
        ===
        last.targetDraw

    );


  if(!targetPurchases.length){

    alert(
      `第${last.targetDraw}回の30通りは購入済みに登録されていません。`
    );

    return;

  }


  let newly = 0;


  purchases.forEach(p => {

    if(
      p.targetDraw
      !==
      last.targetDraw
    )
      return;


    if(p.checked)
      return;


    const mm =

      p.nums.filter(

        n =>
          result.main.includes(n)

      ).length;


    const bm =

      p.nums.filter(

        n =>
          (result.bonus || [])
            .includes(n)

      ).length;


    p.checked = true;

    p.matches = mm;

    p.bonusMatches = bm;

    p.rank =
      rankOf(
        mm,
        bm
      );


    newly++;

  });


  set(
    LS.purchases,
    purchases
  );


  renderAll();


  alert(
    `第${last.targetDraw}回を照合しました。\n${newly}口を新たに照合しました。`
  );

}



/* =========================

  ){

/* =========================
   当選額保存
========================= */

function savePrizes(){

  const draw =
    +document
      .getElementById("prizeDraw")
      .value;


  const amounts = {};


  for(
    let i=1;
    i<=6;
    i++
  ){

    amounts[`${i}等`] =

      +document
        .getElementById(`p${i}`)
        .value

      || 0;

  }


  const purchases =
    get(
      LS.purchases,
      []
    );


  purchases.forEach(p => {

    if(
      p.targetDraw === draw &&
      p.rank
    ){

      p.prize =
        amounts[p.rank]
        || 0;

    }

  });


  set(
    LS.purchases,
    purchases
  );


  renderAll();


  alert(
    `第${draw}回の当選額を収支に反映しました。`
  );

}



/* =========================
   30通り表示
========================= */

function renderTickets(){

  const x =
    get(
      LS.lastTickets,
      null
    );


  const el =
    document
      .getElementById("tickets");


  const purchaseBtn =
    document
      .getElementById("purchaseBtn");


  const purchaseStatus =
    document
      .getElementById("purchaseStatus");


  if(
    !x ||
    !Array.isArray(x.tickets) ||
    !x.tickets.length
  ){

    el.innerHTML =
      "まだ生成していません。";


    purchaseBtn.style.display =
      "none";


    purchaseStatus.style.display =
      "none";


    return;

  }


  const history =
    get(
      LS.history,
      []
    );


  const purchases =
    get(
      LS.purchases,
      []
    );


  const sourceDraw =
    x.sourceDraw ||
    (x.targetDraw - 1);


  const purchased =

    purchases.some(

      p =>
        p.targetDraw
        ===
        x.targetDraw

    );


  el.innerHTML = `

    <div class="prediction-title">

      <strong>
        🎯 第${x.targetDraw}回 予測30通り
      </strong>

      <div class="tiny">
        分析対象：
        第1回〜第${sourceDraw}回
        （${
          history.filter(
            r =>
              r.draw <= sourceDraw
          ).length
        }回分）
      </div>

    </div>


    ${

      x.tickets.map(

        (nums,i) => `

          <div class="ticket">

            <span class="badge">
              ${i+1}
            </span>

            <span class="nums">

              ${

                nums.map(

                  n => `

                    <span class="num">
                      ${String(n).padStart(2,"0")}
                    </span>

                  `

                ).join("")

              }

            </span>

          </div>

        `

      ).join("")

    }


    <div class="notice">

      ℹ️ 過去に出た本数字7個の
      完全一致組み合わせは
      生成対象から除外しています。

      <br><br>

      ただし、この除外や過去の出現傾向を
      利用すること自体が、
      将来の抽せんにおける数学的な
      当選確率を高めるものではありません。

    </div>

  `;


  if(purchased){

    purchaseBtn.style.display =
      "block";


    purchaseBtn.disabled =

    purchaseBtn.textContent =
      `✓ 第${x.targetDraw}回 30通り購入済み`;


    purchaseStatus.style.display =
      "block";


    purchaseStatus.textContent =
      `第${x.targetDraw}回の30通りは購入記録に登録されています。`;

  }

  else{

    purchaseBtn.style.display =
      "block";


    purchaseBtn.disabled =
      false;


    purchaseBtn.textContent =
      "この30通りを購入済みにする（¥9,000）";


    purchaseStatus.style.display =
      "block";


    purchaseStatus.textContent =
      "予測を生成しただけでは購入額には加算されません。";

  }

}



/* =========================
   出現ランキング
========================= */

function renderRanking(){

  const h =
    get(
      LS.history,
      []
    );


  const el =
    document
      .getElementById("ranking");


  if(!h.length){

    el.innerHTML =
      "結果を更新すると表示されます。";

    return;

  }


  const c =
    Array(38).fill(0);


  h.forEach(

    r =>
      r.main.forEach(

        n =>
          c[n]++

      )

  );


  const arr =

    Array.from(
      {length:37},
      (_,i) =>
        [
          i+1,
          c[i+1]
        ]
    )

    .sort(

      (a,b) =>
        b[1] - a[1]
        ||
        a[0] - b[0]

    );


  el.innerHTML =

    arr.map(

      (x,i) =>

        `${i+1}位：${String(x[0]).padStart(2,"0")}（${x[1]}回）`

    ).join("<br>");

}



/* =========================
   一致数表示
========================= */

function renderMatches(){

  const h =
    get(
      LS.history,
      []
    );


  const p =
    get(
      LS.purchases,
      []
    );


  const last =
    get(
      LS.lastTickets,
      null
    );


  const el =
    document
      .getElementById("matchStats");


  if(
    !last ||
    !last.targetDraw
  ){

    el.innerHTML = `

      <div class="result-message">
        まだ予測を生成していません。
      </div>

    `;

    return;

  }


  const target =
    last.targetDraw;


  const result =
    h.find(

      r =>
        r.draw === target

    );


  const targetPurchases =
    p.filter(

      x =>
        x.targetDraw === target

    );


  const purchased =
    targetPurchases.length > 0;


  if(!purchased){

    el.innerHTML = `

      <div class="result-message">

        第${target}回はまだ
        購入済みに登録されていません。

      </div>

      ${emptyMatchBoxes()}

    `;

    return;

  }


  if(!result){

    el.innerHTML = `

      <div class="result-message">

        第${target}回は
        まだ結果未取得です。

        <br>

        抽せん後に「① 結果を更新」を
        押してください。

      </div>

      ${emptyMatchBoxes()}

    `;

    return;

  }


  const checked =
    targetPurchases.filter(
      x => x.checked
    );


  if(!checked.length){

    el.innerHTML = `

      <div
        class="result-message"
        style="
          background:#fff7dc;
          color:#946200;
        "
      >

        第${target}回の結果を取得済みです。

        <br>

        「③ 当選結果と照合」を
        押してください。

      </div>

      ${emptyMatchBoxes()}

    `;

    return;

  }


  const m = {
    3:0,
    4:0,
    5:0,
    6:0,
    7:0
  };


  checked.forEach(x => {

    if(
      m[x.matches]
      !==
      undefined
    ){

      m[x.matches]++;

    }

  });


  el.innerHTML = `

    <div class="result-message">

      第${target}回
      30通りの照合結果

    </div>


    <div class="match-grid">

      <div class="match-box">
        3個一致
        <b>${m[3]}口</b>
      </div>

      <div class="match-box">
        4個一致
        <b>${m[4]}口</b>
      </div>

      <div class="match-box">
        5個一致
        <b>${m[5]}口</b>
      </div>

      <div class="match-box">
        6個一致
        <b>${m[6]}口</b>
      </div>

      <div class="match-box">
        7個一致
        <b>${m[7]}口</b>
      </div>

    </div>

  `;

}

/* =========================
   全体描画
========================= */

function renderAll(){

  const h =
    get(
      LS.history,
      []
    );


  const p =
    get(
      LS.purchases,
      []
    );


  const last =
    get(
      LS.lastTickets,
      null
    );


  document
    .getElementById("latestDraw")
    .textContent =

    h.length
      ?
      `第${h[h.length-1].draw}回`
      :
      "-";


  document
    .getElementById("historyCount")
    .textContent =
    h.length;


  /*
    purchases に存在するものだけ
    実購入として集計
  */

  const purchase =

    p.reduce(

      (s,x) =>
        s + (x.price || 0),

      0

    );


  const prize =

    p.reduce(

      (s,x) =>
        s + (x.prize || 0),

      0

    );


  const profit =
    prize - purchase;


  document
    .getElementById("purchase")
    .textContent =
    yen(purchase);


  document
    .getElementById("prize")
    .textContent =
    yen(prize);


  const pe =
    document
      .getElementById("profit");


  pe.textContent =
    yen(profit);


  pe.className =
    profit >= 0
      ?
      "good"
      :
      "bad";


  const profitBox =
    document
      .getElementById("profitBox");


  profitBox.style.background =
    profit >= 0
      ?
      "#eafaf2"
      :
      "#fff0f0";


  /*
    照合済み表示も
    現在の予測回だけ
  */

  let checkedCount = 0;


  if(
    last &&
    last.targetDraw
  ){

    checkedCount =

      p.filter(

        x =>
          x.targetDraw
            ===
          last.targetDraw

          &&

          x.checked

      ).length;

  }


  document
    .getElementById("checked")
    .textContent =

    `${checkedCount}口`;


  renderTickets();

  renderMatches();

  renderRanking();

}

   起動
========================= */

window.addEventListener(
  "load",
  () => {

    const s =
      get(
        LS.settings,
        null
      );


    if(s){

      for(
        const k of
        [
          "allW",
          "recentW",
          "uniformW",
          "maxOverlap"
        ]
      ){

        if(
          s[k] != null
        ){

          document
            .getElementById(k)
            .value =
            s[k];

        }

      }

    }


    [
      "allW",
      "recentW",
      "uniformW",
      "maxOverlap"
    ]

    .forEach(k => {

      document
        .getElementById(k)
        .addEventListener(
          "change",
          () => {

            set(

              LS.settings,

              Object.fromEntries(

                [
                  "allW",
                  "recentW",
                  "uniformW",
                  "maxOverlap"
                ]

                .map(

                  x => [

                    x,

                    document
                      .getElementById(x)
                      .value

                  ]

                )

              )

            );

          }

        );

    });


    if(
      "serviceWorker"
      in
      navigator
    ){

      navigator
        .serviceWorker
        .register(
          "/static/sw.js"
        )
        .catch(
          e =>
            console.log(
              "SW:",
              e
            )
        );

    }


    renderAll();

  }
);
